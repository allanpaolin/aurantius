<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Gerador de QR Code | Aurantius Labs</title>
    <meta name="description" content="Crie QR Codes de forma simples, rápida e segura para links e redes Wi-Fi. 100% gratuito e privado.">
    
    <!-- Favicons oficiais da AURANTIUS (Caminho relativo para a pasta assets na raiz) -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon-16x16.png">
    <link rel="manifest" href="../../assets/images/site.webmanifest">
    
    <!-- Tipografia: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS: Importação Global e Local -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="labs-environment">

    <!-- Wrapper principal do aplicativo -->
    <main class="app-wrapper">
        
        <article class="app-card" aria-labelledby="app-title">
            
            <!-- Cabeçalho da Ferramenta -->
            <header class="app-header">
                <a href="../index.html" class="labs-signature" aria-label="Voltar para o ecossistema Aurantius Labs">Aurantius Labs</a>
                <h1 id="app-title" class="title">Gerador de QR Code</h1>
                <p class="subtitle">Crie QR Codes de forma simples e rápida.</p>
            </header>

            <!-- ESTADO 1: Entrada de Dados (Formulários) -->
            <div id="state-input" class="app-state active">
                
                <!-- Controle Segmentado (Alternância entre Link e Wi-Fi) -->
                <div class="segmented-control" role="tablist" aria-label="Modo de geração do QR Code">
                    <button type="button" id="tab-link" class="segment-btn active" role="tab" aria-selected="true" aria-controls="form-link">
                        <i data-lucide="link-2" class="segment-icon" aria-hidden="true"></i> Link
                    </button>
                    <button type="button" id="tab-wifi" class="segment-btn" role="tab" aria-selected="false" aria-controls="form-wifi">
                        <i data-lucide="wifi" class="segment-icon" aria-hidden="true"></i> Wi-Fi
                    </button>
                </div>

                <div class="forms-container">
                    <!-- Formulário: Modo Link -->
                    <form id="form-link" class="qr-form active" role="tabpanel" aria-labelledby="tab-link" novalidate>
                        <div class="input-group">
                            <label for="input-url" class="input-label">URL</label>
                            <input type="url" id="input-url" name="input-url" class="input-field" placeholder="https://exemplo.com" required aria-required="true">
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Gerar QR Code</button>
                        </div>
                    </form>

                    <!-- Formulário: Modo Wi-Fi -->
                    <form id="form-wifi" class="qr-form hidden" role="tabpanel" aria-labelledby="tab-wifi" novalidate>
                        <div class="input-group">
                            <label for="wifi-ssid" class="input-label">Nome da rede Wi-Fi</label>
                            <input type="text" id="wifi-ssid" name="wifi-ssid" class="input-field" placeholder="Ex: Minha Rede" required aria-required="true">
                        </div>
                        
                        <!-- Wrapper para controle visual da senha (eye-icon toggle) -->
                        <div class="input-group" id="group-password">
                            <label for="wifi-password" class="input-label">Senha do Wi-Fi</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="wifi-password" name="wifi-password" class="input-field" placeholder="Insira a senha" required>
                                <button type="button" id="toggle-password" class="btn-toggle-password" aria-label="Mostrar senha">
                                    <i data-lucide="eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="wifi-encryption" class="input-label">Segurança da rede</label>
                            <select id="wifi-encryption" name="wifi-encryption" class="input-select">
                                <option value="WPA" selected>WPA / WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">Sem senha</option>
                            </select>
                            <p class="help-text">Não sabe qual escolher? Deixe WPA / WPA2, que é a opção mais comum.</p>
                        </div>

                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Gerar QR Code</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ESTADO 2: Resultado (QR Code Gerado) -->
            <div id="state-result" class="app-state hidden" aria-live="polite">
                <div class="result-wrapper">
                    <!-- Container que receberá o canvas/img do QRCode.js -->
                    <div id="qrcode-display" class="qrcode-container" aria-label="QR Code gerado"></div>
                    
                    <!-- Informação discreta do conteúdo associado ao QR Code -->
                    <div class="result-info">
                        <span class="result-label" id="result-type-label">Destino</span>
                        <p id="result-content" class="result-content-text">https://exemplo.com</p>
                    </div>
                </div>

                <div class="action-buttons result-actions">
                    <button type="button" id="btn-download" class="btn btn-primary">
                        <i data-lucide="download" class="btn-icon" aria-hidden="true"></i>
                        <span>Baixar PNG</span>
                    </button>
                    
                    <button type="button" id="btn-new" class="btn btn-secondary">
                        <i data-lucide="rotate-ccw" class="btn-icon" aria-hidden="true"></i>
                        <span>Novo QR Code</span>
                    </button>
                </div>
            </div>
            
        </article>
        
    </main>

    <!-- Biblioteca QRCode.js (via CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    
    <!-- Scripts: Ícones, Global e Local -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="../../assets/js/global.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
